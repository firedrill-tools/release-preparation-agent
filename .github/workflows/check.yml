name: Check
on:
  push:
  pull_request:
jobs:
  offline-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run package:check
      - uses: actions/upload-artifact@v4
        with:
          name: release-preparation-source
          path: |
            dist/*-source.tar.gz
            dist/qualification.json
            dist/fresh-tests.log
